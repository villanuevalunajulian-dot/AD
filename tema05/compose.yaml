services:
  db:
    image: postgres:16-alpine
    container_name: postgres_medac
    restart: always
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: alumno
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
