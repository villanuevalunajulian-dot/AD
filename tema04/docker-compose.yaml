services:
  mysql:
    image: mysql:8.4
    container_name: mysql-netbeans
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: AD
      MYSQL_USER: julian
      MYSQL_PASSWORD: julian123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: